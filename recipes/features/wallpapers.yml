# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        # KDE/Plasma wallpaper collections (historic KDE + modern Plasma)
        - kde-wallpapers
        - plasma-workspace-wallpapers

  - type: script
    scripts:
      # Borealis' own collections (Auveiss-Modified, Nature) are baked into the
      # image — no network downloads, so the build can't break on a vendor URL
      # going away. Register them with the Plasma wallpaper picker.
      - install-borealis-wallpapers.sh