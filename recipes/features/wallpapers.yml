# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        # KDE/Plasma wallpaper collections (historic KDE + modern Plasma)
        - kde-wallpapers
        - plasma-workspace-wallpapers

  - type: script
    scripts:
      # Download, flatten and register extra collections with the Plasma
      # wallpaper picker (/usr/share/wallpapers/<Collection>/...metadata.json).
      - install-ubuntu-wallpapers.sh
      - install-system76-wallpaper.sh
      - install-framework-wallpaper.sh
      - install-floating-woof.sh
      - install-floating-skies.sh