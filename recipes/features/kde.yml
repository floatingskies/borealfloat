# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: files
    # KDE Plasma performance & polish. The config file lives in this feature's
    # own tree (files/kde/) while everything else ships via system-files.yml.
    files:
      - source: kde/etc/xdg/kwinrc
        destination: /etc/xdg/kwinrc