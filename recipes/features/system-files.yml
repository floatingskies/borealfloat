# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  - type: signing
  - type: files
    # Ship everything under files/system/ into the root of the image.
    files:
      - source: system
        destination: /
  - type: script
    # Replace Aurora's login banner with the lean Borealis fastfetch greeting.
    scripts:
      - disable-ublue-motd.sh