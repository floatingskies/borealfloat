# Borealis login-screen wallpaper.
#
# Fedora 44+ replaces SDDM with Plasma Login Manager (plasmalogin) on KDE, and
# plasmalogin is configured via /etc/plasmalogin.conf (which overrides the
# distro defaults in /usr/lib/plasmalogin/defaults.conf). Point the greeter at
# the same registered wallpaper package the desktop uses, so the login screen
# and the first desktop frame share one artwork. The path must be readable by
# the plasmalogin system user - /usr/share/wallpapers is.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/borealis/borealis-windwaker-island/borealis-windwaker-island.jpg
